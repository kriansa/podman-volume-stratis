name: Cleanup PR Artifacts

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete PR Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prefix = `pr-${context.issue.number}-`;

            const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const matching = artifacts.filter(a => a.name.startsWith(prefix) && !a.expired);

            for (const artifact of matching) {
              console.log(`Deleting artifact: ${artifact.name} (id: ${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

            console.log(`Deleted ${matching.length} artifact(s) for PR #${context.issue.number}`);
