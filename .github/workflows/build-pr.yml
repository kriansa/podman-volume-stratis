name: Build PR Artifacts

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  pull-requests: write

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --config build/goreleaser.yml --snapshot --clean --skip=publish

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-pr-${{ github.event.pull_request.number }}
          path: |
            build/dist/*.tar.gz
            build/dist/*.rpm
            build/dist/checksums.txt
          retention-days: 7

      - name: Comment on PR with artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### 📦 Build Artifacts

            Artifacts for this PR are available for download from the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).

            Go to the workflow run page and scroll to the **Artifacts** section to download the packages.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### 📦 Build Artifacts')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
