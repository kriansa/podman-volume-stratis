name: Build PR Packages

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  pull-requests: write

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --config build/goreleaser.yml --snapshot --clean --skip=publish

      - name: Upload tarball (linux/amd64)
        id: tarball-amd64
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-tarball-linux-amd64
          path: build/dist/*_linux_amd64.tar.gz
          retention-days: 7

      - name: Upload tarball (linux/arm64)
        id: tarball-arm64
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-tarball-linux-arm64
          path: build/dist/*_linux_arm64.tar.gz
          retention-days: 7

      - name: Upload RPM (x86_64)
        id: rpm-x86-64
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-rpm-x86_64
          path: build/dist/*_linux_amd64.rpm
          retention-days: 7

      - name: Upload RPM (aarch64)
        id: rpm-aarch64
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-rpm-aarch64
          path: build/dist/*_linux_arm64.rpm
          retention-days: 7

      - name: Upload checksums
        id: checksums
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-checksums
          path: build/dist/checksums.txt
          retention-days: 7

      - name: Comment on PR with package links
        uses: actions/github-script@v7
        with:
          script: |
            const baseUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts`;
            const artifacts = [
              { id: '${{ steps.tarball-amd64.outputs.artifact-id }}', desc: 'tarball', arch: 'linux/amd64' },
              { id: '${{ steps.tarball-arm64.outputs.artifact-id }}', desc: 'tarball', arch: 'linux/arm64' },
              { id: '${{ steps.rpm-x86-64.outputs.artifact-id }}', desc: 'RPM', arch: 'x86_64' },
              { id: '${{ steps.rpm-aarch64.outputs.artifact-id }}', desc: 'RPM', arch: 'aarch64' },
              { id: '${{ steps.checksums.outputs.artifact-id }}', desc: 'checksums', arch: '—' },
            ];

            const rows = artifacts
              .map(a => `| ${a.desc} | ${a.arch} | [Download](${baseUrl}/${a.id}) |`)
              .join('\n');

            const body = [
              '### Packages',
              '',
              '| Package | Arch | |',
              '|---------|------|-|',
              rows,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### Packages')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
